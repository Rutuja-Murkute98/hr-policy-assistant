# Runs on every push and pull request. No API keys are needed.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: pip install -r requirements-api.txt -r ui/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Scan dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements-api.txt -r ui/requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Evaluation quality gate
        run: python -m evaluation.quality_gate

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Compose file
        run: docker compose config --quiet
      - name: Build the images
        run: docker compose build
