# Runs on every push and pull request. No API keys are needed.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: pip install -r requirements-api.txt -r ui/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Scan dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements-api.txt -r ui/requirements.txt -r requirements-dev.txt
      - name: Test, with coverage
        # 87% when the floor was set. It stays a little below, so a small change doesn't fail CI. See D43.
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=85
      - name: Evaluation quality gate
        run: python -m evaluation.quality_gate

  containers:
    runs-on: ubuntu-latest
    # Only for the containers started here. The model key is never used, because the checks below need no model.
    env:
      HELPDESK_API_KEY: ci-smoke-key
      GOOGLE_API_KEY: not-used-by-the-smoke-test
      AUTH_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - name: Check the Compose file
        run: docker compose config --quiet
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for the API and the chat screen
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/live && curl -fsS http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check the running stack, without the model
        env:
          CHECK_API_KEY: ci-smoke-key
        run: |
          pip install httpx==0.28.1
          python -m ops.check_deployment --api-url http://localhost:8000 --ui-url http://localhost:8501 \
            --no-model --allow-empty-index
      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
