[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real PostgreSQL with pgvector, but no model API"]

[tool.coverage.run]
source = ["app", "pipeline", "evaluation", "integrations", "ops"]
omit = ["evaluation/review_app.py"]  # run by Streamlit's test runner in its own process, so it isn't measured

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["venv", "pgdata"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/knowledge.py" = ["E501"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
packages = ["app", "pipeline", "evaluation", "integrations", "ops"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
